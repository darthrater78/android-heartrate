# The property is org.gradle.jvmargs. It was previously written as org.gradle.jvm.args,
# which is not a Gradle property at all -- it was silently ignored, so the daemon ran on
# its 512 MiB default and the -Xmx2048m above it never took effect. R8 needs far more
# than that: the first minified build after v1.4.1 died with the JVM garbage collector
# thrashing at 512 MiB heap / 384 MiB metaspace while minifying Compose.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
