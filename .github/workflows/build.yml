name: Build

# Compiles the app on every push and pull request. GitHub's Linux runners ship with
# the Android SDK already installed, so there is nothing to set up beyond a JDK.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# The job only reads the repository and uploads an artifact; it never writes back.
# Narrowing the default token means a compromised build step cannot push commits,
# publish releases, or comment on issues.
permissions:
  contents: read

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # Handles the dependency cache, so later runs are considerably faster.
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        # Attaches the APK to the workflow run, so it can be downloaded and installed
        # without a local Android toolchain.
        uses: actions/upload-artifact@v4
        with:
          name: heart-rate-mirror-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
