name: Release

# Manually triggered from the Actions tab (works fine from a phone browser, no local
# Android toolchain or git tag push needed). Builds a signed release APK from the version
# currently in app/build.gradle.kts, tags it, and publishes a GitHub Release with the APK
# attached.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Tag and publish a GitHub Release. Turn OFF to build a signed test APK and
          attach it to this run as an artifact without tagging or releasing --
          used for diagnostic builds that must not consume a version number.
        type: boolean
        default: true

# Needs to push a tag and create a release, unlike build.yml which only reads.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          # Tags are needed by the duplicate-tag guard below. The default shallow
          # checkout does not fetch them, which made that guard pass on a tag that
          # already existed on the remote and pushed the failure down to `git push`.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Confirm tag does not already exist
        if: inputs.publish
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists. Bump versionName before releasing again." >&2
            exit 1
          fi

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK for release
        run: |
          mkdir -p out
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo "No release APK found in app/build/outputs/apk/release" >&2
            exit 1
          fi
          # A non-publishing run is a diagnostic build. Name it so it can never be
          # mistaken for the real released artifact of the same version.
          if [ "${{ inputs.publish }}" = "true" ]; then
            name="heart-rate-mirror-${{ steps.version.outputs.tag }}.apk"
          else
            name="heart-rate-mirror-${{ steps.version.outputs.tag }}-test.apk"
          fi
          cp "$apk" "out/$name"

      - name: Attach APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: heart-rate-mirror-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Tag the release commit
        if: inputs.publish
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            See the [version history](https://github.com/${{ github.repository }}/blob/master/README.md#version-history) in the README for what changed in this release.
          files: out/*.apk
