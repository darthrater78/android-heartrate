version: 2
updates:
  # Keeps the SHA-pinned actions and their version comments current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # The app's Gradle dependencies and plugins, read from gradle/libs.versions.toml.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Grouped for review convenience, not as a risk judgement: a minor bump can still
      # need a toolchain change, and only a build settles that. Majors stay ungrouped.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
